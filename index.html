<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A digital jukebox-style confessional for anonymously sharing a secret song">
    <title>The Musical Confessional Booth</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Welcome Screen -->
    <section id="welcome-screen" class="screen active">
        <div class="content">
            <h1 class="title">The Musical<br>Confessional Booth</h1>
            <p class="subtitle">Share your secret song anonymously</p>
            <button id="start-btn" class="cta-button">Enter the Booth</button>
        </div>
    </section>

    <!-- Song Submission Screen -->
    <section id="submission-screen" class="screen">
        <div class="content">
            <h2 class="screen-title">Your Secret Song</h2>
            <p class="instruction">Tell us about the song that holds your secret</p>
            <form id="song-form">
                <div class="form-group">
                    <label for="song-name">Song Title</label>
                    <input type="text" id="song-name" name="song-name" placeholder="Enter song title" required>
                </div>
                <div class="form-group">
                    <label for="artist-name">Artist</label>
                    <input type="text" id="artist-name" name="artist-name" placeholder="Enter artist name" required>
                </div>
                <button type="submit" class="cta-button">Submit Confession</button>
            </form>
        </div>
    </section>

    <!-- Thank You Screen -->
    <section id="thankyou-screen" class="screen">
        <div class="content">
            <h2 class="screen-title">Thank You</h2>
            <p class="message">Your secret song has been received.<br>It will live on in the jukebox of confessions.</p>
            <button id="restart-btn" class="cta-button">Return to Start</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
